tf32: true
mixed_precision: bf16
resume: true
disable_tqdm: false
max_steps: 620
# The Slurm launcher fills these at runtime.  Keeping both keys in the schema
# makes Hydra overrides explicit and lets direct, non-Slurm runs use the
# relative limit as a fallback.
max_time_seconds: null
deadline_unix_seconds: null
# Before starting any accumulation cycle, require at least this much time until
# the coordinated-stop deadline.  Later cycles use the larger of this floor and
# the duration observed for the preceding cycle.
minimum_optimizer_cycle_runway_seconds: 1200
gradient_accumulation_steps: 1
gradient_clipping: 1
compile: true
compile_fullgraph: false
find_unused_parameters: false
accelerate:
  save_steps: 100
  max_ckpt: 3
model:
  save_steps: 100
  max_ckpt: 7
  save_at_end: true
  export_at_end: true
dir: logs/checkpoints
