tf32: true
mixed_precision: bf16
resume: true
disable_tqdm: false

# 42,000 * 32 packed sequences/update * 512 = 688,128,000 token positions.
max_steps: 42000
gradient_accumulation_steps: 4
gradient_clipping: 1.0

# Emergency guard for the three-hour allocation. The calibrated step ceilings
# normally finish first, leaving three minutes for final export. A guard stop
# is marked incomplete so its dependent benchmark cannot publish partial data.
max_time_seconds: 10620

# Compilation is intentionally disabled for the first controlled sweep. The
# custom native operators should be measured directly.
compile: false
compile_fullgraph: false
find_unused_parameters: false

validation:
  eval_steps: 7000
  max_batches: 32
  seed: 314159

accelerate:
  save_steps: 7000
  max_ckpt: 3
model:
  save_steps: 7000
  max_ckpt: 7
  save_at_end: true
  export_at_end: true
dir: logs/attention_ablation/unset
