hidden_size: 768
num_hidden_layers: 33
num_attention_heads: 12
intermediate_size: 4000
rope: true
rms_norm: true
embedding_rms_norm: false
hidden_act: gelu
fused_swiglu: false
dropout: 0
attention_dropout: 0
norm_eps: 1e-05
embedding_init_range: 0.02
decoder_init_range: 0.02
tie_word_embeddings: true
lm_head_bias: false
ngpt: false

# Exactly parameter-matched to attention-ablation-multispace-300m. With
# vocab_size=30,522 this model has 304,101,120 trainable real scalar
# parameters. Only depth changes relative to the 100M pair.
attention_space: real
attention_backend: flash
